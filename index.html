function updateBasketLoad(group, goods) {
    const w = Math.min(goods.firewood, 8);
    const c = Math.min(goods.corn, 10);
    const e = Math.min(goods.eggs, 8);
    const sig = `${w}|${c}|${e}`;
    if (group.userData.sig === sig)
        return;
    group.userData.sig = sig;
    group.clear();
    const logMat = mat('g-log', () => std(0x6b4a2f, 0.9, 0));
    const logEnd = mat('g-logend', () => std(0xc89a62, 0.8, 0));
    const cobMat = mat('g-cob', () => std(0xf0c53a, 0.6, 0));
    const huskMat = mat('g-husk', () => std(0x6a9a3a, 0.8, 0, undefined, THREE.DoubleSide));
    const eggMat = mat('g-egg', () => std(0xf6eddc, 0.45, 0));
    const logGeo = geoOnce('g-loggeo', () => new THREE.CylinderGeometry(0.03, 0.034, 0.5, 8));
    const endGeo = geoOnce('g-endgeo', () => new THREE.CircleGeometry(0.03, 8));
    const cobGeo = geoOnce('g-cobgeo', () => new THREE.CapsuleGeometry(0.036, 0.17, 4, 8));
    const huskGeo = geoOnce('g-huskgeo', () => new THREE.ConeGeometry(0.045, 0.16, 6));
    const eggGeo = geoOnce('g-egggeo', () => new THREE.SphereGeometry(0.04, 10, 8));
    // firewood bundle standing in the back half of the basket
    for (let i = 0; i < w; i++) {
        const a = (i / 8) * Math.PI * 2 + 0.4;
        const r = 0.05 + (i % 3) * 0.035;
        const log = new THREE.Mesh(logGeo, logMat);
        log.position.set(Math.sin(a) * r, 0.5, -0.03 - Math.abs(Math.cos(a)) * r);
        log.rotation.set(0.12 * Math.cos(a), 0, -0.12 * Math.sin(a));
        log.castShadow = true;
        const end = new THREE.Mesh(endGeo, logEnd);
        end.rotation.x = -Math.PI / 2;
        end.position.y = 0.251;
        log.add(end);
        group.add(log);
    }
    // corn cobs with green husk, leaning out of the front half
    for (let i = 0; i < c; i++) {
        const a = (i / 10) * Math.PI * 2;
        const r = 0.06 + (i % 2) * 0.05;
        const cob = new THREE.Group();
        const grain = new THREE.Mesh(cobGeo, cobMat);
        grain.position.y = 0.09;
        const husk = new THREE.Mesh(huskGeo, huskMat);
        husk.rotation.x = Math.PI;
        husk.position.y = -0.02;
        cob.add(grain, husk);
        cob.position.set(Math.sin(a) * r, 0.43 + (i % 3) * 0.02, 0.04 + Math.cos(a) * r * 0.6);
        cob.rotation.set(Math.cos(a) * 0.3, a, -Math.sin(a) * 0.3);
        cob.traverse((o) => (o.castShadow = true));
        group.add(cob);
    }
    // eggs nestled on top
    for (let i = 0; i < e; i++) {
        const a = (i / 8) * Math.PI * 2;
        const egg = new THREE.Mesh(eggGeo, eggMat);
        egg.scale.set(0.8, 1, 0.8);
        egg.position.set(Math.sin(a) * 0.09, 0.4 + (i % 2) * 0.03, 0.03 + Math.cos(a) * 0.08);
        egg.castShadow = true;
        group.add(egg);
    }
}
const onceGeos = new Map();
function geoOnce(key, make) {
    let g = onceGeos.get(key);
    if (!g) {
        g = make();
        onceGeos.set(key, g);
        geoCache.push(g);
    }
    return g;
